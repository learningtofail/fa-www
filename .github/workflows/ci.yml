name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      # CI always does the network diff against the pinned Orchis DS commit; locally an offline run falls back to the recorded sha256.
      - run: npm run tokens:check -- --require-network
      - run: npm run format:check
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # The site is built exactly once. The e2e job tests this artifact and the deploy job ships it.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Refuse an empty build
        run: test -s dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: End-to-end
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, unit, e2e, audit]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # Queue deploys rather than cancelling one that is mid-switch.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # for scripts/ only; the site comes from the artifact
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Refuse an empty artifact
        run: test -s dist/index.html

      - name: Require the pinned SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "::error title=SSH_KNOWN_HOSTS secret is empty::Create it before deploying (docs/caddy/Caddyfile.proposed.md, step 3). The deploy never trusts a host key it was not given."
            exit 1
          fi

      # Pinned by full commit SHA (the v2 tag is annotated; this is the commit it points to). Dependabot moves it.
      - name: Connect to Tailscale
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy as an atomic release
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          RELEASE_ID: ${{ github.sha }}
          DEPLOY_BASE: /opt/static-web/sites/www
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/ssh"
          printf '%s' "${SSH_PRIVATE_KEY}" | base64 -d > "${RUNNER_TEMP}/ssh/deploy_key"
          chmod 600 "${RUNNER_TEMP}/ssh/deploy_key"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/ssh/known_hosts"
          SSH_KEY_FILE="${RUNNER_TEMP}/ssh/deploy_key" \
          SSH_KNOWN_HOSTS_FILE="${RUNNER_TEMP}/ssh/known_hosts" \
            bash scripts/deploy.sh
